<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f14" />
    <title>ARModule camera test</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, sans-serif;
        color: #fff;
      }
      #ar-root {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      .top-controls {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 30;
        padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 14px;
        background: linear-gradient(to bottom, rgba(10, 15, 20, 0.85), transparent);
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: auto;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #e8edf2;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 8px 14px;
        border-radius: 20px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: background 0.2s;
      }
      .back-link:hover,
      .back-link:active {
        background: rgba(255, 255, 255, 0.25);
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 16px;
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.4);
        backdrop-filter: blur(12px);
      }
      .status-pill.found {
        background: rgba(22, 163, 74, 0.25);
        color: #4ade80;
        border-color: rgba(74, 222, 128, 0.5);
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      #hud {
        font-size: 12px;
        line-height: 1.45;
        color: #94a3b8;
        font-family: ui-monospace, monospace;
        word-break: break-all;
        pointer-events: none;
      }
      #print-hint {
        position: fixed;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        left: 12px;
        right: 12px;
        z-index: 30;
        font-size: 13px;
        padding: 10px 14px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        color: #d1d5db;
        text-align: center;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: auto;
      }
      #print-hint a {
        color: #5eead4;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="top-controls">
      <div class="top-row">
        <a href="/" class="back-link" id="back-link">‹ Back to App</a>
        <div class="status-pill" id="status-pill">
          <span class="status-dot"></span>
          <span id="status-text">Scanning…</span>
        </div>
      </div>
      <div id="hud">Starting camera…</div>
    </div>
    <div id="ar-root"></div>
    <div id="print-hint">
      <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 6px;">Target Cards to Scan / Print:</div>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;">
        <a href="/markers/card.png" target="_blank" rel="noopener">Default Card</a>
        <a href="/markers/faulty-wiring.jpg" target="_blank" rel="noopener">⚡ Faulty Wiring</a>
        <a href="/markers/fire-hazard.jpg" target="_blank" rel="noopener">🔥 Fire Hazard</a>
        <a href="/markers/gas-leak.jpg" target="_blank" rel="noopener">💨 Gas Leak</a>
        <a href="/markers/confined-space.jpg" target="_blank" rel="noopener">⚠️ Confined Space</a>
      </div>
    </div>
    <script type="module" src="/src/ar/test.js"></script>
  </body>
</html>
